apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: caw-local
servers: 1
agents: 2
image: rancher/k3s:v1.31.5-k3s1
options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:0
      - arg: --disable=metrics-server
        nodeFilters:
          - server:0
