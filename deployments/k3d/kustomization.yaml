# File metadata (manifest mirror):
# Purpose: Kustomize assembly for the k3d layer; it composes ../k8s/base/namespace.yaml, ../k8s/base/security-accounts.yaml, ../k8s/base/config.yaml, ../k8s/base/workloads.yaml, ../k8s/base/services-ingress.yaml, ../k8s/migrate/migration-job.yaml, platform.yaml into the deployable manifest without duplicating those resources.
