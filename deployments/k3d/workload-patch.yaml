apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: local-data
          emptyDir: {sizeLimit: 512Mi}
      containers:
        - name: gateway
          image: contract-audit-backend:local
          volumeMounts:
            - {name: local-data, mountPath: /var/lib/contract-audit}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: local-data
          emptyDir: {sizeLimit: 512Mi}
      containers:
        - name: core-api
          image: contract-audit-backend:local
          volumeMounts:
            - {name: local-data, mountPath: /var/lib/contract-audit}
          env:
            - name: SYSTEM_HEALTH_URL
              value: http://health-monitor:8092
---
