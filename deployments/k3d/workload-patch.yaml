apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: nginx-tempdirs
          image: contract-audit-client:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec", "mkdir -p /tmp/nginx/client_body /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi"]
          volumeMounts: [{name: tmp, mountPath: /tmp/nginx}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
            readOnlyRootFilesystem: true
      containers:
        - name: nginx
          image: contract-audit-client:local
          volumeMounts:
            - {name: tmp, mountPath: /tmp/nginx}
---
