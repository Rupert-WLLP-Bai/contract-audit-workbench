apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor
  labels: {app.kubernetes.io/part-of: contract-audit}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: health-monitor-read-pods
  namespace: contract-audit
  labels: {app.kubernetes.io/part-of: contract-audit}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: health-monitor-read-pods
  namespace: contract-audit
  labels: {app.kubernetes.io/part-of: contract-audit}
subjects:
  - kind: ServiceAccount
    name: health-monitor
    namespace: contract-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: health-monitor-read-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: contract-audit-health-monitor-node-read
  labels: {app.kubernetes.io/part-of: contract-audit}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: contract-audit-health-monitor-node-read
  labels: {app.kubernetes.io/part-of: contract-audit}
subjects:
  - kind: ServiceAccount
    name: health-monitor
    namespace: contract-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: contract-audit-health-monitor-node-read
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  labels: {app.kubernetes.io/name: health-monitor, app.kubernetes.io/part-of: contract-audit}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: health-monitor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: health-monitor, app.kubernetes.io/part-of: contract-audit}
    spec:
      serviceAccountName: health-monitor
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: local-data
          emptyDir: {sizeLimit: 512Mi}
      containers:
        - name: health-monitor
          image: contract-audit-backend:local
          imagePullPolicy: IfNotPresent
          args: ["/app/healthmonitor"]
          ports: [{name: http, containerPort: 8092}]
          env:
            - {name: APP_ENV, value: development}
            - {name: SYSTEM_HEALTH_PROJECT, value: caw-local}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LLM_BASE_URL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: LLM_BASE_URL}}
            - name: LLM_MODEL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: LLM_MODEL}}
            - name: OCR_MODEL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: OCR_MODEL}}
            - name: MINERU_URL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: MINERU_URL}}
            - name: MODEL_GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: MODEL_GATEWAY_URL}}
            - name: TYPESAFE_JEV_BASE_URL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_BASE_URL}}
            - name: TYPESAFE_JEV_MODE
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_MODE}}
            - name: TYPESAFE_JEV_EGRESS
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_EGRESS}}
            - name: TYPESAFE_JEV_FEATURES
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_FEATURES}}
            - name: TYPESAFE_JEV_MODEL
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_MODEL}}
            - name: TYPESAFE_JEV_PROVIDER
              valueFrom: {configMapKeyRef: {name: contract-audit-runtime, key: TYPESAFE_JEV_PROVIDER}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: local-data, mountPath: /var/lib/contract-audit}
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  labels: {app.kubernetes.io/name: health-monitor, app.kubernetes.io/part-of: contract-audit}
spec:
  selector: {app.kubernetes.io/name: health-monitor}
  ports: [{name: http, port: 8092, targetPort: http}]
