apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: caw-local-full
servers: 1
agents: 4
image: rancher/k3s:v1.33.5-k3s1
options:
  k3d:
    wait: true
    timeout: 180s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:0
      - arg: --disable=metrics-server
        nodeFilters:
          - server:0
