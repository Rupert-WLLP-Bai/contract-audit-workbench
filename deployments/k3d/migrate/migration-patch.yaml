# File metadata (manifest mirror):
# Purpose: Overrides the migration Job for the single-machine k3d profile: mounts local database storage, reads the local DEV_DATABASE_URL secret, and applies the image/service-account settings required by that cluster.
# Author: Bai Junhao <baijunhao@cq.chinamobile.com>
