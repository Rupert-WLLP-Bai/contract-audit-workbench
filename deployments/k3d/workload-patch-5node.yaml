# Full local profile: one control-plane node and four agents, with the
# critical services spread across agents. This is still one machine; it proves
# scheduling, replica failover and instance identity, not physical HA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # Local verification wants every attempt exported; the production
            # base samples 10% via traceidratio instead.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 2
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: core-api}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: core-api
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # Local verification wants every attempt exported; the production
            # base samples 10% via traceidratio instead.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
---
