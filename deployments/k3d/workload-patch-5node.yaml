apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
spec:
  template:
    spec:
      containers:
        - name: health-monitor
          env:
            - name: SYSTEM_HEALTH_EXPECTED_REPLICAS
              value: core-api=2,audit-worker=3,model-gateway=2,tool-gateway=2,gateway=1,document-service=1,audit-execution=1,otel-collector=1,tempo=1,prometheus=1,grafana=1
