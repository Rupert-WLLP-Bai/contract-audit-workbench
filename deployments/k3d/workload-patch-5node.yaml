apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
spec:
  replicas: 3
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: audit-worker}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: audit-worker
          # The local 2 GiB agents keep the worker request below production size
          # so a rolling update can drain the previous revision. This is a local
          # scheduling envelope, not a production capacity claim.
          resources:
            requests: {cpu: 250m, memory: 320Mi}
            limits: {cpu: "2", memory: 2Gi}
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # Local verification wants every attempt exported; the production
            # base samples 10% via traceidratio instead.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
spec:
  replicas: 2
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: model-gateway}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: model-gateway
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            # Deterministic test double for experience distillation only. The
            # review planner remains deterministic and does not use this route.
            - name: MODEL_GATEWAY_FIXTURE_CHAT_CONTENT
              value: '{"schema_version":"experience-candidate/v1","applicability":["付款发生在验收后"],"exclusions":["验收前付款"],"check_action":"核对验收日期与付款条款","minimum_evidence":["验收记录"],"counterexamples":["验收前付款仍需核查"],"valid_from":"2020-01-01T00:00:00Z","valid_until":"2100-01-01T00:00:00Z","policy_refs":[],"review_diff":""}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # Local verification wants every attempt exported; the production
            # base samples 10% via traceidratio instead.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
---
