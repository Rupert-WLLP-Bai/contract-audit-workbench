  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: contract-audit}
spec:
  type: ClusterIP
  sessionAffinity: None
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
