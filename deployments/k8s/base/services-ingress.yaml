---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-audit
  labels: {app.kubernetes.io/part-of: contract-audit}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com, admin.example.com, portal.example.com]
      secretName: contract-audit-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /openapi.json, pathType: Exact, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: client, port: {name: http}}}}
    - host: admin.example.com
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /openapi.json, pathType: Exact, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: admin, port: {name: http}}}}
    - host: portal.example.com
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /openapi.json, pathType: Exact, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: portal, port: {name: http}}}}
