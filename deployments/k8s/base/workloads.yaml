apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  labels: &model-labels
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/part-of: contract-audit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: *model-labels
  template:
    metadata:
      labels: *model-labels
    spec:
      serviceAccountName: model-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: model-gateway}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: model-gateway}}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: model-gateway}}
      containers:
        - name: model-gateway
          image: contract-audit-backend:release
          imagePullPolicy: IfNotPresent
          args: ["/app/modelgateway"]
          ports: [{name: http, containerPort: 8084}]
          envFrom: [{configMapRef: {name: contract-audit-runtime}}]
          env:
            - name: SERVICE_ROLE
              value: model
            - name: MODEL_DATABASE_URL
              valueFrom: {secretKeyRef: {name: contract-audit-db-urls, key: MODEL_DATABASE_URL}}
            - name: ADDR
              value: ":8084"
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-model, key: LLM_API_KEY}}
            # Opens the sealed credential written by the core admin surface.
            - name: LLM_CONFIG_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-model, key: LLM_CONFIG_KEY, optional: true}}
            # Only the gateway holds the TypeSafe credential. Missing key leaves
            # Jev unconfigured without affecting chat/OCR readiness.
            - name: TYPESAFE_API_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-model, key: TYPESAFE_API_KEY, optional: true}}
            - name: WORKER_MODEL_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: WORKER_MODEL_TOKEN}}
            - name: DOCUMENT_MODEL_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: DOCUMENT_MODEL_TOKEN}}
            - name: CORE_MODEL_AUTHORITY_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: CORE_MODEL_AUTHORITY_TOKEN}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop: {exec: {command: ["/bin/sh", "-c", "sleep 5"]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: core-authority-ca, mountPath: /run/contract-audit/core-authority-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: core-authority-ca, configMap: {name: contract-audit-core-authority-ca, optional: true}}
---
