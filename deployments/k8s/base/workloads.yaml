apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: &gateway-labels
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: contract-audit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: *gateway-labels
  template:
    metadata:
      labels: *gateway-labels
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
      containers:
        - name: gateway
          image: contract-audit-backend:release
          imagePullPolicy: IfNotPresent
          args: ["/app/gateway"]
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: contract-audit-runtime}}]
          env:
            - name: ADDR
              value: ":8080"
            - name: GATEWAY_CORE_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: GATEWAY_CORE_TOKEN}}
            - name: GATEWAY_DOCUMENT_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: GATEWAY_DOCUMENT_TOKEN}}
            - name: GATEWAY_EXECUTION_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: GATEWAY_EXECUTION_TOKEN}}
            - name: GATEWAY_TOOL_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: GATEWAY_TOOL_TOKEN}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  labels: &core-labels
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: contract-audit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: *core-labels
  template:
    metadata:
      labels: *core-labels
    spec:
      serviceAccountName: core-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: core-api}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: core-api}}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: core-api}}
      containers:
        - name: core-api
          image: contract-audit-backend:release
          imagePullPolicy: IfNotPresent
          args: ["/app/server"]
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: contract-audit-runtime}}]
          env:
            - name: SERVICE_ROLE
              value: core
            - name: CONTEXT_SWITCH_ENABLED
              valueFrom: {configMapKeyRef: {name: contract-audit-core-runtime, key: CONTEXT_SWITCH_ENABLED}}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: contract-audit-db-urls, key: CORE_DATABASE_URL}}
            - name: ADDR
              value: ":8081"
            - name: GATEWAY_ROLE_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: GATEWAY_CORE_TOKEN}}
            - name: WORKER_CORE_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: WORKER_CORE_TOKEN}}
            - name: CORE_DOCUMENT_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: CORE_DOCUMENT_TOKEN}}
            - name: TOOL_CORE_AUTHORITY_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: TOOL_CORE_AUTHORITY_TOKEN}}
            - name: CORE_MODEL_AUTHORITY_TOKEN
              valueFrom: {secretKeyRef: {name: contract-audit-service-tokens, key: CORE_MODEL_AUTHORITY_TOKEN}}
            # Seals admin-managed LLM credentials. Optional: absent leaves the
            # endpoint registry readable but refuses saving or probing secrets.
            - name: LLM_CONFIG_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-model, key: LLM_CONFIG_KEY, optional: true}}
            # Seals restricted supplier fields before persistence. Optional:
            # absent makes restricted-field writes fail closed.
            - name: CLM_DATA_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-clm, key: CLM_DATA_KEY, optional: true}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: contract-audit-oidc, key: OIDC_CLIENT_SECRET, optional: true}}
            - name: OIDC_ADMIN_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: contract-audit-oidc, key: OIDC_ADMIN_CLIENT_SECRET, optional: true}}
            - name: OIDC_STATE_KEY
              valueFrom: {secretKeyRef: {name: contract-audit-oidc, key: OIDC_STATE_KEY, optional: true}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop: {exec: {command: ["/bin/sh", "-c", "sleep 5"]}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
