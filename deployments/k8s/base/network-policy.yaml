apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-api-oidc-egress
  namespace: contract-audit
  labels: {app.kubernetes.io/part-of: contract-audit}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: core-api}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
