  minReplicas: 2
  maxReplicas: 30
  metrics:
    # CPU only: the job-depth signal (contract_audit_ready_jobs) is SPEC_ONLY.
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 6, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Percent, value: 20, periodSeconds: 60}]}
