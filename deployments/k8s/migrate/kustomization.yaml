# Source template for the one-shot schema and service-role migration.
# For a release, use deployments/scripts/migrate-k8s.sh <candidate-lock.json>;
# deployments/scripts/release-k8s.py renders this template with the candidate's
# backend registry digest, creates a uniquely named Job and waits for completion.
# The deploy command requires that same Job and lock before applying workloads.
# Raw `kubectl apply -k` uses a mutable development template and is not a release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contract-audit
resources:
  - migration-job.yaml
