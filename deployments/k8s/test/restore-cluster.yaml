apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  generateName: contract-audit-test-restore-
  namespace: contract-audit-test
  labels: {app.kubernetes.io/part-of: contract-audit}
spec:
  instances: 1
  enablePDB: false
  storage: {size: 20Gi}
  walStorage: {size: 5Gi}
  bootstrap:
    recovery:
      source: contract-audit-test-backup-source
      recoveryTarget:
        targetImmediate: true
  externalClusters:
    - name: contract-audit-test-backup-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: contract-audit-test-backups
          serverName: contract-audit-test-db
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: contract-audit-test-backups
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
