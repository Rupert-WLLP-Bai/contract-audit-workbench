kind: Cluster
metadata:
  name: __RESTORE_NAME__
  namespace: contract-audit-test
  labels: {app.kubernetes.io/part-of: contract-audit, environment: test}
  annotations:
    contract-audit.test/backup-name: __BACKUP_NAME__
