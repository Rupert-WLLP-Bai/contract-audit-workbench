# File metadata (manifest mirror):
# Purpose: Configures the Kubernetes NATS chart as a three-replica cluster with JetStream file storage on a 100 GiB PVC, bounded resources, and graceful lame-duck termination.
# Author: Bai Junhao <baijunhao@cq.chinamobile.com>
# Contact: +86 13617696321
# Created: 2026-10-25
# Updated: 2026-11-01
# Revision: r2
# Copyright: See LICENSE
# End file metadata.

global:
  labels:
    app.kubernetes.io/part-of: contract-audit
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      dir: /data
      pvc:
        enabled: true
        size: 100Gi
  lameDuckGracePeriod: 10s
  lameDuckDuration: 2m
container:
  image:
    repository: nats
    tag: 2.15.1-alpine
    digest: sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    pullPolicy: IfNotPresent
  merge:
    resources:
      requests: {cpu: "2", memory: 8Gi}
      limits: {cpu: "2", memory: 8Gi}
podTemplate:
  terminationGracePeriodSeconds: 150
  topologySpreadConstraints:
    kubernetes.io/hostname:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
    topology.kubernetes.io/zone:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
  merge:
    automountServiceAccountToken: false
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nats
            topologyKey: kubernetes.io/hostname
podDisruptionBudget:
  enabled: true
  merge:
    spec:
      minAvailable: 2
natsBox:
  enabled: false
service:
  enabled: true
  ports:
    nats:
      enabled: true
    cluster:
      enabled: false
    monitor:
      enabled: false
headlessService:
  merge:
    metadata:
      labels:
        app.kubernetes.io/name: nats
