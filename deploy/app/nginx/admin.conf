server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index admin.html;
    client_max_body_size 25m;

    # Keep redirects relative: the host publishes this site on a different port
    # than the container listener, so an absolute Location would leave the site.
    absolute_redirect off;

    include /etc/nginx/snippets/backend-proxy.conf;

    location = / {
        return 308 /admin/;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /admin.html;
    }

    location / {
        try_files $uri $uri/ /admin.html;
    }
}
