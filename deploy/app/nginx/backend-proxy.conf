resolver 127.0.0.11 valid=10s ipv6=off;
set $gateway_backend gateway:8080;

location = /api {
    proxy_pass http://$gateway_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ^~ /api/ {
    proxy_pass http://$gateway_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /openapi.json {
    proxy_pass http://$gateway_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /mcp {
    proxy_pass http://$gateway_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ^~ /mcp/ {
    proxy_pass http://$gateway_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}
