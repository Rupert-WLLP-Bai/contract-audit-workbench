# Credential submissions get a coarse per-client-IP budget at the shared edge.
# The in-process limiter counts per replica; this budget keeps a spray from
# scaling across replicas. Only the POST that submits credentials is counted;
# the GET status and DELETE logout calls on the same path stay unthrottled.
map "$request_method:$uri" $login_throttle_key {
    default "";
    "POST:/api/session" $binary_remote_addr;
}
limit_req_zone $login_throttle_key zone=login_edge:1m rate=30r/m;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index portal.html;
    client_max_body_size 33m;

    # Keep redirects relative: the host publishes this site on a different port
    # than the container listener, so an absolute Location would leave the site.
    absolute_redirect off;

    include /etc/nginx/snippets/backend-proxy.conf;

    location = /api/session {
        limit_req zone=login_edge burst=10 nodelay;
        # Rejections answer in the API's JSON error shape; the stock nginx
        # error page would disclose the server version.
        error_page 429 = @login_throttled;
        proxy_pass http://$gateway_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location @login_throttled {
        default_type application/json;
        return 429 '{"error":"登录尝试过于频繁，请稍后重试","code":"login_throttled"}';
    }

    location = / {
        return 308 /portal/;
    }

    location = /portal {
        return 308 /portal/;
    }

    location ^~ /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        try_files $uri $uri/ /portal.html;
    }

    location / {
        try_files $uri $uri/ /portal.html;
    }
}
