# End file metadata.

name: 行为错误
description: 登记可复现的现有行为错误
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 只有本轮可关闭的事项才建 Issue；只选一个主 area，提交后给 Issue 加上对应的 area 标签。
  - type: checkboxes
    id: iteration_ready
    attributes:
      label: 本轮可关闭
      options:
        - label: 一到两个 PR 能完成
          required: true
        - label: 验收条款本轮可执行，所需环境、数据、模型和账号已经具备
          required: true
        - label: 不依赖外部人员、用户暂缓事项或其他未排期工作
          required: true
        - label: 已写明不做什么
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 主 area 标签
      options:
        - area:audit
        - area:docs
        - area:infra
        - area:tenant
        - area:web
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 问题与目标
      description: 说明复现条件、当前行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与排除项
      description: 列出本 Issue 包含和不包含的工作。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: 列出阻塞、相关 Issue 或写“无”。
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 文件所有权
      description: 列出允许修改的文件或目录。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写成可逐项核对的结果。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 最小验证
      description: 指定受影响的局部检查；未执行时记录 NOT_RUN。
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 回退
      description: 说明回退方式和数据/兼容性限制。
    validations:
      required: true
  - type: textarea
    id: docs_terms
    attributes:
      label: 文档、概念与文件说明影响
      description: 说明需维护的文档/术语，或写“无”。
    validations:
      required: true
