# File metadata (manifest mirror):
# Purpose: GitHub Issue Form “行为错误”: 登记可复现的现有行为错误. It collects 问题与目标, 范围与排除项, 依赖, 文件所有权, 验收条件, 最小验证, 回退, 文档、概念与文件说明影响 and applies the initial labels bug, 阶段/待实现, 验收/NOT_RUN; the selected area label is added after submission.
