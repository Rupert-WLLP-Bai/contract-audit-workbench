# Copyright: See LICENSE
# End file metadata.

name: pr-fast

# Actions are pinned to full commit SHAs (resolved from the official tags);
# re-pin deliberately, never back to a movable major tag.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  GOFLAGS: -mod=readonly

jobs:
  pr-fast-gate:
    name: pr-fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - name: Checkout pull request with full base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load gate controller from the fixed target baseline
        run: git show "$BASE_SHA:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"

      - name: Plan scoped checks
        id: plan
        run: >-
          python3 "$RUNNER_TEMP/trusted-gate-runner.py" fast
          --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --subject "$SUBJECT_SHA" --
          --plan
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true' || steps.plan.outputs.workflow == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned workflow syntax checker
        if: steps.plan.outputs.workflow == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Download Go modules
        if: steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true'
        run: go mod download

      - name: Set up Bun
        if: steps.plan.outputs.web == 'true' || steps.plan.outputs.docs_build == 'true' || steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'

      - name: Set up Node
        if: steps.plan.outputs.web == 'true' || steps.plan.outputs.docs_build == 'true' || steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up Python tooling runtime
        if: steps.plan.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned Ruff
        if: steps.plan.outputs.python == 'true'
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Install web dependencies
        if: steps.plan.outputs.web == 'true' || steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true'
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check OpenAPI and frontend wire generation
        if: steps.plan.outputs.go == 'true' || steps.plan.outputs.architecture == 'true'
        run: make check-openapi-generated

      - name: Install scoped system packages
        if: steps.plan.outputs.poppler == 'true' || steps.plan.outputs.database == 'true'
        env:
          NEED_POPPLER: ${{ steps.plan.outputs.poppler }}
          NEED_POSTGRES_CLIENT: ${{ steps.plan.outputs.database }}
        run: |
          set -euo pipefail
          packages=()
          if [ "$NEED_POPPLER" = "true" ]; then
            packages+=(poppler-utils poppler-data)
          fi
          if [ "$NEED_POSTGRES_CLIENT" = "true" ]; then
            packages+=(postgresql-client)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
          if [ "$NEED_POPPLER" = "true" ]; then
            command -v pdfinfo
            command -v pdftotext
            command -v pdfimages
            command -v pdftoppm
            test -d /usr/share/poppler/cMap
          fi
          if [ "$NEED_POSTGRES_CLIENT" = "true" ]; then
            command -v psql
          fi

      - name: Prepare pinned legal test assets
        if: steps.plan.outputs.legal_assets == 'true'
        env:
          CAW_LEGAL_TEST_ARCHIVE_XZ_01: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_01 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_02: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_02 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_03: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_03 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_04: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_04 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_05: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_05 }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_legal_test_assets.py --destination "$RUNNER_TEMP/caw-legal-fast"
          {
            echo "LEGALNORM_ASSET_DIR=$RUNNER_TEMP/caw-legal-fast/legal-sources"
            echo "LEGALNORM_SUPPLEMENTAL_ASSET_DIR=$RUNNER_TEMP/caw-legal-fast/legal-sources"
            echo "LEGALNORM_CANONICAL_MANIFEST=$RUNNER_TEMP/caw-legal-fast/p4-canonical-articles-v2.json"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL 18 for sensitive paths
        if: steps.plan.outputs.database == 'true'
        run: |
          set -euo pipefail
          docker run -d --name caw-fast-pg \
            --env POSTGRES_USER=contractaudit \
            --env POSTGRES_PASSWORD=contractaudit \
            --env POSTGRES_DB=postgres \
            --publish 5432:5432 \
            postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
          for _ in $(seq 1 60); do
            if docker exec caw-fast-pg pg_isready -U contractaudit -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs caw-fast-pg
          exit 1

      - name: Provision isolated test database role
        if: steps.plan.outputs.database == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: contractaudit
          PGPASSWORD: contractaudit
        run: bash scripts/provision_test_db.sh

      - name: Run scoped fast checks
        env:
          CAW_DOCS_PREVIEW_DIR: ${{ runner.temp }}/caw-docs-preview
          CAW_METADATA_EXTERNAL_GUARD: "1"
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" fast --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --subject "$SUBJECT_SHA" --

      - name: Verify architecture with the fixed target controller
        if: steps.plan.outputs.architecture == 'true'
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" architecture --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --subject "$SUBJECT_SHA" -- --out "$RUNNER_TEMP/caw-fast/architecture-base-guard.json"

      - name: Verify file metadata from fixed target branch tools
        if: always()
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile
          base, subject = os.environ['BASE_SHA'], os.environ['SUBJECT_SHA']
          def git(*args):
              return subprocess.check_output(['git', *args])
          if git('rev-parse', 'HEAD').decode().strip() != subject:
              raise SystemExit('checkout does not match the fixed PR head')
          names = ['metadata_core', 'git_inventory', 'manifest_tool', 'legacy_bootstrap', 'gate_adapter']
          paths = ['scripts/file_metadata/'+name+'.py' for name in names]
          entries = {}
          for row in git('ls-tree', '-z', base, '--', *paths).split(b'\0'):
              if row:
                  fields, path = row.split(b'\t', 1)
                  entries[path.decode()] = fields.decode().split()
          if not entries:
              policy = json.loads(git('show', base+':scripts/file_metadata/policy.json'))
              manifest = json.loads(git('show', base+':scripts/file_metadata/manifest.json'))
              if policy.get('manifest_status') != 'populated-from-issue-115-baseline' or not manifest.get('files'):
                  raise SystemExit('BASE lacks a trusted metadata verifier and a recognized legacy registry')
              result = {'status':'NOT_RUN', 'mode':'fixed-base-foundation', 'base':base, 'subject':subject,
                        'reason':'Target BASE has no verifier yet; candidate code cannot attest initialization.'}
              accepted = True
          else:
              if set(entries) != set(paths):
                  raise SystemExit('BASE metadata verifier is incomplete')
              directory = pathlib.Path(tempfile.mkdtemp(prefix='caw-metadata-base-', dir=os.environ['RUNNER_TEMP']))
              for path, (mode, kind, oid) in entries.items():
                  if mode not in ('100644','100755') or kind != 'blob':
                      raise SystemExit('BASE metadata verifier has an unsupported file mode')
                  raw = git('cat-file', 'blob', oid)
                  if not raw:
                      raise SystemExit('BASE metadata verifier contains an empty module')
                  (directory / pathlib.PurePosixPath(path).name).write_bytes(raw)
              run = subprocess.run([sys.executable, str(directory/'gate_adapter.py'), 'check',
                                    '--repo', os.getcwd(), '--base', base, '--subject', subject],
                                   text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              try:
                  result = json.loads(run.stdout)
              except json.JSONDecodeError:
                  result = {'status':'FAIL', 'mode':'trusted-base', 'error':run.stderr.strip() or 'metadata guard emitted no JSON'}
              accepted = (run.returncode == 0 and result.get('status') == 'PASS' or
                          run.returncode == 3 and result.get('status') == 'NOT_RUN')
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'caw-fast'/'file-metadata-base-guard.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps({key:result[key] for key in ('status','mode','base','subject','reason') if key in result}, ensure_ascii=False))
          if not accepted:
              raise SystemExit('fixed-BASE metadata verification failed')
          PY

      - name: Upload documentation preview
        if: steps.plan.outputs.docs_build == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-site-preview
          path: ${{ runner.temp }}/caw-docs-preview
          if-no-files-found: error
          retention-days: 7

      - name: Upload fast evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-fast-evidence
          path: ${{ runner.temp }}/caw-fast
          if-no-files-found: ignore
          retention-days: 7
