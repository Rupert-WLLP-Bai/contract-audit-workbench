# File metadata (manifest mirror):
# Purpose: GitHub Actions workflow “pr-fast” wires the pr-fast-gate jobs to its configured trigger; these gates own only the checks stated in the workflow.
# Author: Bai Junhao <baijunhao@cq.chinamobile.com>
# Contact: +86 13617696321
# Created: 2026-10-31
# Updated: 2026-11-12
