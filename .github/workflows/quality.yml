name: deterministic-quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: make setup
      - name: Install browser and OS dependencies
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Full deterministic acceptance
        run: make acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/*.json
            artifacts/*.out
            artifacts/logs/
            web/coverage/
          if-no-files-found: error
          retention-days: 14
