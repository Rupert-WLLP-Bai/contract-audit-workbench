name: deterministic-quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: make setup
      - name: Install browser, Poppler, and database client
        working-directory: web
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils poppler-data postgresql-client
          command -v pdfinfo
          command -v pdftotext
          command -v pdfimages
          command -v pdftoppm
          test -d /usr/share/poppler/cMap
          bun x playwright install --with-deps chromium
      - name: Provision acceptance database roles
        env:
          PGPASSWORD: contractaudit
        run: |
          psql -h 127.0.0.1 -U contractaudit -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE contract_audit_test'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'contract_audit_test')\gexec
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'contract_audit_model') THEN
              CREATE ROLE contract_audit_model LOGIN PASSWORD 'contractaudit'
                NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE contract_audit_test TO contract_audit_model;
          SQL
      - name: Full deterministic acceptance
        run: make acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/*.json
            artifacts/*.out
            artifacts/logs/
            web/coverage/
          if-no-files-found: error
          retention-days: 14
