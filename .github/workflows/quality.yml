name: deterministic-quality
run-name: "${{ inputs.validation_only && 'Workflow validation only' || 'Full deterministic quality' }}: ${{ inputs.ref || github.sha }}"

# Actions are pinned to full commit SHAs (resolved from the official tags);
# re-pin deliberately, never back to a movable major tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to verify; defaults to the dispatched revision"
        required: false
        type: string
        default: ""
      validation_only:
        description: "Validate workflow startup and syntax only; full acceptance remains NOT_RUN"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ inputs.ref || github.sha }}-${{ inputs.validation_only && 'syntax' || 'full' }}
  cancel-in-progress: false
env:
  APP_ENV: test
jobs:
  prepare:
    name: resolve target SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the exact commit verified by every stage
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "full quality entry verifies $sha" >> "$GITHUB_STEP_SUMMARY"

  workflow-validation:
    name: workflow syntax and startup
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -shellcheck= -pyflakes=
      - name: Record validation scope
        env:
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          if [ "$VALIDATION_ONLY" = "true" ]; then
            echo 'Workflow startup/syntax PASS; full acceptance NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"
          fi

  static:
    name: static checks
    needs: [prepare, workflow-validation]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      CAW_FAST_BASE: ${{ needs.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Prepare TypeScript test prerequisites
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install pinned Ruff
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Install pinned workflow syntax checker
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Load fixed BASE gate controller
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: git show "$TRUSTED_BASE:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"
      - name: Independently execute BASE Python and architecture gates
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
          TRUSTED_SUBJECT: ${{ needs.prepare.outputs.sha }}
        run: |
          git show "$TRUSTED_BASE:scripts/run_python_tests.py" > "$RUNNER_TEMP/base-python-gate.py"
          python3 "$RUNNER_TEMP/base-python-gate.py" --root scripts --root deploy/tests --root deployments/scripts --json-out "$RUNNER_TEMP/base-python-report.json"
          python3 "$RUNNER_TEMP/trusted-gate-runner.py" architecture --repo "$GITHUB_WORKSPACE" --base "$TRUSTED_BASE" --subject "$TRUSTED_SUBJECT" -- --out "$RUNNER_TEMP/base-architecture-report.json"
      - name: Static gate
        env:
          CAW_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CAW_CI_SUBJECT_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" quality --repo "$GITHUB_WORKSPACE" --base "$CAW_CI_BASE_SHA" --subject "$CAW_CI_SUBJECT_SHA" -- --stage static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-static
          path: |
            artifacts/verification-static.json
            artifacts/logs/
            ${{ runner.temp }}/base-python-report.json
            ${{ runner.temp }}/base-architecture-report.json
          if-no-files-found: warn
          retention-days: 14

  go:
    name: go tests
    needs: [prepare, workflow-validation]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GOFLAGS: -mod=readonly
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Install PostgreSQL client and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client poppler-utils poppler-data
          command -v pdfinfo
          command -v pdftotext
          command -v pdfimages
          command -v pdftoppm
          test -d /usr/share/poppler/cMap
      - name: Size isolated PostgreSQL lock capacity
        env:
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$TEST_PG_CONTAINER" psql -U contractaudit -d postgres -c "ALTER SYSTEM SET max_locks_per_transaction = '512'"
          docker restart "$TEST_PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$TEST_PG_CONTAINER" pg_isready -U contractaudit -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$TEST_PG_CONTAINER"
          exit 1
      - name: Provision test database role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: contractaudit
          PGPASSWORD: contractaudit
        run: bash scripts/provision_test_db.sh
      - name: Test legal asset preparation
        run: python3 scripts/test_fetch_legal_test_assets.py
      - name: Prepare pinned legal test assets
        env:
          CAW_LEGAL_TEST_ARCHIVE_XZ_01: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_01 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_02: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_02 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_03: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_03 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_04: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_04 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_05: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_05 }}
        run: python3 scripts/fetch_legal_test_assets.py --destination "$RUNNER_TEMP/caw-legal-test-assets"
      - name: Load fixed BASE gate controller
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: git show "$TRUSTED_BASE:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"
      - name: Go gate
        env:
          LEGALNORM_ASSET_DIR: ${{ runner.temp }}/caw-legal-test-assets/legal-sources
          LEGALNORM_SUPPLEMENTAL_ASSET_DIR: ${{ runner.temp }}/caw-legal-test-assets/legal-sources
          LEGALNORM_CANONICAL_MANIFEST: ${{ runner.temp }}/caw-legal-test-assets/p4-canonical-articles-v2.json
          CAW_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CAW_CI_SUBJECT_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" quality --repo "$GITHUB_WORKSPACE" --base "$CAW_CI_BASE_SHA" --subject "$CAW_CI_SUBJECT_SHA" -- --stage go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-go
          path: |
            artifacts/verification-go.json
            artifacts/logs/
            artifacts/evaluation.json
            artifacts/agent-demo.json
            artifacts/ruleshadow-disabled.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-go
          path: artifacts/go-coverage.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: web tests
    needs: [prepare, workflow-validation]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Load fixed BASE gate controller
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: git show "$TRUSTED_BASE:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"
      - name: Web gate
        env:
          CAW_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CAW_CI_SUBJECT_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" quality --repo "$GITHUB_WORKSPACE" --base "$CAW_CI_BASE_SHA" --subject "$CAW_CI_SUBJECT_SHA" -- --stage web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-web
          path: |
            artifacts/verification-web.json
            artifacts/logs/
            artifacts/vitest-results.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-web
          path: web/coverage/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: coverage gates
    needs: [prepare, go, web]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-go
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-web
          path: web/coverage
      - name: Verify coverage inputs
        run: |
          test -s artifacts/go-coverage.out
          test -s web/coverage/coverage-summary.json
      - name: Load fixed BASE gate controller
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: git show "$TRUSTED_BASE:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"
      - name: Coverage gate
        env:
          CAW_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CAW_CI_SUBJECT_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" quality --repo "$GITHUB_WORKSPACE" --base "$CAW_CI_BASE_SHA" --subject "$CAW_CI_SUBJECT_SHA" -- --stage coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-coverage
          path: |
            artifacts/verification-coverage.json
            artifacts/coverage-summary.json
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: browser acceptance
    needs: [prepare, static]
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GOFLAGS: -mod=readonly
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Download Go modules
        run: go mod download
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install PostgreSQL client and Chromium
        working-directory: web
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bun x playwright install --with-deps chromium
      - name: Size isolated PostgreSQL lock capacity
        env:
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$TEST_PG_CONTAINER" psql -U contractaudit -d postgres -c "ALTER SYSTEM SET max_locks_per_transaction = '512'"
          docker restart "$TEST_PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$TEST_PG_CONTAINER" pg_isready -U contractaudit -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$TEST_PG_CONTAINER"
          exit 1
      - name: Provision test database role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: contractaudit
          PGPASSWORD: contractaudit
        run: bash scripts/provision_test_db.sh
      - name: Test legal asset preparation
        run: python3 scripts/test_fetch_legal_test_assets.py
      - name: Prepare pinned legal test assets
        env:
          CAW_LEGAL_TEST_ARCHIVE_XZ_01: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_01 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_02: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_02 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_03: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_03 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_04: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_04 }}
          CAW_LEGAL_TEST_ARCHIVE_XZ_05: ${{ vars.CAW_LEGAL_TEST_ARCHIVE_XZ_05 }}
        run: python3 scripts/fetch_legal_test_assets.py --destination "$RUNNER_TEMP/caw-legal-test-assets"
      - name: Load fixed BASE gate controller
        env:
          TRUSTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: git show "$TRUSTED_BASE:scripts/trusted_gate_runner.py" > "$RUNNER_TEMP/trusted-gate-runner.py"
      - name: Browser gate
        env:
          CAW_DELIVERY_DIR: ${{ runner.temp }}/caw-delivery
          LEGALNORM_ASSET_DIR: ${{ runner.temp }}/caw-legal-test-assets/legal-sources
          LEGALNORM_SUPPLEMENTAL_ASSET_DIR: ${{ runner.temp }}/caw-legal-test-assets/legal-sources
          LEGALNORM_CANONICAL_MANIFEST: ${{ runner.temp }}/caw-legal-test-assets/p4-canonical-articles-v2.json
          CAW_CI_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CAW_CI_SUBJECT_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 "$RUNNER_TEMP/trusted-gate-runner.py" quality --repo "$GITHUB_WORKSPACE" --base "$CAW_CI_BASE_SHA" --subject "$CAW_CI_SUBJECT_SHA" -- --stage browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-browser
          path: |
            artifacts/verification-browser.json
            artifacts/logs/
            artifacts/screenshots/
            ${{ runner.temp }}/caw-delivery/
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: quality gate
    if: ${{ always() && !inputs.validation_only }}
    needs: [prepare, workflow-validation, static, go, web, coverage, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate
        env:
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_WORKFLOW: ${{ needs.workflow-validation.result }}
          RESULT_STATIC: ${{ needs.static.result }}
          RESULT_GO: ${{ needs.go.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_BROWSER: ${{ needs.browser.result }}
          VERIFIED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "## full quality entry"
            echo ""
            echo "verified commit: \`$VERIFIED_SHA\`"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "prepare=$RESULT_PREPARE" "workflow=$RESULT_WORKFLOW" "static=$RESULT_STATIC" "go=$RESULT_GO" \
                       "web=$RESULT_WEB" "coverage=$RESULT_COVERAGE" "browser=$RESULT_BROWSER"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error title=quality gate::the full quality entry requires every stage to succeed; skipped, cancelled, or failed stages are not a PASS"
            exit 1
          fi
