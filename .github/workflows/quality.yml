# Purpose: GitHub Actions workflow “deterministic-quality” wires the prepare, static, go, web, coverage, browser, quality-gate jobs to its configured trigger; these gates own only the checks stated in the workflow.
# Author: Bai Junhao <baijunhao@cq.chinamobile.com>
