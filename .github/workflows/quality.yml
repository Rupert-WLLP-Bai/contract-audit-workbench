name: deterministic-quality

# Actions are pinned to full commit SHAs (resolved from the official tags);
# re-pin deliberately, never back to a movable major tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to verify; defaults to the dispatched revision"
        required: false
        type: string
        default: ""

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_ENV: test
jobs:
  prepare:
    name: resolve target SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Pin the exact commit verified by every stage
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "full quality entry verifies $sha" >> "$GITHUB_STEP_SUMMARY"

  static:
    name: static checks
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Static gate
        run: python3 scripts/verify.py --stage static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-static
          path: |
            artifacts/verification-static.json
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  go:
    name: go tests
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GOFLAGS: -mod=readonly
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Install PostgreSQL client and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client poppler-utils poppler-data
          command -v pdfinfo
          command -v pdftotext
          command -v pdfimages
          command -v pdftoppm
          test -d /usr/share/poppler/cMap
      - name: Provision test database role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: contractaudit
          PGPASSWORD: contractaudit
        run: bash scripts/provision_test_db.sh
      - name: Test legal asset preparation
        run: python3 scripts/test_fetch_legal_test_assets.py
      - name: Prepare pinned legal test assets
        run: python3 scripts/fetch_legal_test_assets.py --destination "$RUNNER_TEMP/caw-legal-test-assets"
      - name: Go gate
        env:
          LEGALNORM_ASSET_DIR: ${{ runner.temp }}/caw-legal-test-assets/legal-sources
          LEGALNORM_CANONICAL_MANIFEST: ${{ runner.temp }}/caw-legal-test-assets/p4-canonical-articles-v2.json
        run: python3 scripts/verify.py --stage go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-go
          path: |
            artifacts/verification-go.json
            artifacts/logs/
            artifacts/evaluation.json
            artifacts/agent-demo.json
            artifacts/ruleshadow-disabled.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-go
          path: artifacts/go-coverage.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: web tests
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Web gate
        run: python3 scripts/verify.py --stage web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-web
          path: |
            artifacts/verification-web.json
            artifacts/logs/
            artifacts/vitest-results.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-web
          path: web/coverage/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: coverage gates
    needs: [prepare, go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-go
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-web
          path: web/coverage
      - name: Verify coverage inputs
        run: |
          test -s artifacts/go-coverage.out
          test -s web/coverage/coverage-summary.json
      - name: Coverage gate
        run: python3 scripts/verify.py --stage coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-coverage
          path: |
            artifacts/verification-coverage.json
            artifacts/coverage-summary.json
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: browser acceptance
    needs: [prepare, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: contractaudit
          POSTGRES_PASSWORD: contractaudit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractaudit -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GOFLAGS: -mod=readonly
      TEST_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgres://contractaudit:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
      MODEL_DATABASE_URL: postgres://contract_audit_model:contractaudit@127.0.0.1:5432/contract_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Download Go modules
        run: go mod download
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install PostgreSQL client and Chromium
        working-directory: web
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bun x playwright install --with-deps chromium
      - name: Provision test database role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: contractaudit
          PGPASSWORD: contractaudit
        run: bash scripts/provision_test_db.sh
      - name: Browser gate
        run: python3 scripts/verify.py --stage browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-browser
          path: |
            artifacts/verification-browser.json
            artifacts/logs/
            artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: quality gate
    if: always()
    needs: [prepare, static, go, web, coverage, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate
        env:
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_STATIC: ${{ needs.static.result }}
          RESULT_GO: ${{ needs.go.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_BROWSER: ${{ needs.browser.result }}
          VERIFIED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "## full quality entry"
            echo ""
            echo "verified commit: \`$VERIFIED_SHA\`"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "prepare=$RESULT_PREPARE" "static=$RESULT_STATIC" "go=$RESULT_GO" \
                       "web=$RESULT_WEB" "coverage=$RESULT_COVERAGE" "browser=$RESULT_BROWSER"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error title=quality gate::the full quality entry requires every stage to succeed; skipped, cancelled, or failed stages are not a PASS"
            exit 1
          fi
