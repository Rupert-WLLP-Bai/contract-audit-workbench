name: release-candidate

# Explicit manual release-candidate entry: image packaging, SBOM, vulnerability
# scanning and deployment-manifest verification against one fixed target SHA.
# Normal pull requests (pr-fast) and main verification (quality.yml) never run
# these heavy jobs. Actions are pinned to full commit SHAs resolved from the
# official tags; re-pin deliberately, never back to a movable major tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to package; defaults to the dispatched revision"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  prepare:
    name: resolve target SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Pin the exact commit packaged and scanned by every stage
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release candidate entry packages $sha" >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: package images with SBOM and vulnerability scan
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build the poppler dependency base for offline packaging
        run: |
          set -euo pipefail
          docker build -f deploy/app/Dockerfile.pdf-runtime \
            -t contract-audit-pdf-runtime:local .
          docker image inspect contract-audit-pdf-runtime:local \
            --format 'pdf-runtime base {{.Id}} {{.Os}}/{{.Architecture}}'

      - name: Package the four candidate images
        run: >-
          python3 deployments/scripts/package-app-images.py
          --base contract-audit-pdf-runtime:local
          --report artifacts/release-candidate/app-images.json

      - name: SBOM for backend image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: contract-audit-backend:local
          format: cyclonedx-json
          output-file: artifacts/release-candidate/sbom-backend.cdx.json
          upload-artifact: false
      - name: SBOM for client image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: contract-audit-client:local
          format: cyclonedx-json
          output-file: artifacts/release-candidate/sbom-client.cdx.json
          upload-artifact: false
      - name: SBOM for admin image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: contract-audit-admin:local
          format: cyclonedx-json
          output-file: artifacts/release-candidate/sbom-admin.cdx.json
          upload-artifact: false
      - name: SBOM for portal image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: contract-audit-portal:local
          format: cyclonedx-json
          output-file: artifacts/release-candidate/sbom-portal.cdx.json
          upload-artifact: false

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: contract-audit-backend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/release-candidate/trivy-backend.json
          version: v0.70.0
      - name: Scan client image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: contract-audit-client:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/release-candidate/trivy-client.json
          version: v0.70.0
      - name: Scan admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: contract-audit-admin:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/release-candidate/trivy-admin.json
          version: v0.70.0
      - name: Scan portal image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: contract-audit-portal:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/release-candidate/trivy-portal.json
          version: v0.70.0

      - name: Summarize packaged candidate
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          report_path = pathlib.Path("artifacts/release-candidate/app-images.json")
          if not report_path.is_file():
              print("packaging report was not produced; see the job log for the failure")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              binaries = report.get("binary_sha256") or {}
              print("## packaged candidate images")
              print()
              print(f"packaging status: `{report.get('status')}`")
              identity = report.get("source_identity_sha256")
              if identity:
                  print(f"source identity: `{identity}`")
              print(f"go binaries hashed: {len(binaries)}")
              print()
              print("| image | image id | platform | packaging |")
              print("| --- | --- | --- | --- |")
              for image in report.get("images") or []:
                  print(f"| {image.get('tag')} | `{image.get('image_id')}` | "
                        f"{image.get('platform')} | {image.get('packaging')} |")
              print()
              print("SBOM and Trivy results for every image are retained in the "
                    "release-candidate-evidence artifact; Trivy fails the run on "
                    "fixable HIGH/CRITICAL vulnerabilities.")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-candidate-evidence
          path: artifacts/release-candidate/
          if-no-files-found: warn
          retention-days: 30

  manifests:
    name: deployment manifest verification
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PyYAML for the conformance checker
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml
      - name: Verify deployment manifests
        run: python3 deployments/scripts/manifest-conformance.py

  release-gate:
    name: release candidate gate
    if: always()
    needs: [prepare, candidate, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every stage
        env:
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_CANDIDATE: ${{ needs.candidate.result }}
          RESULT_MANIFESTS: ${{ needs.manifests.result }}
          VERIFIED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "## release candidate entry"
            echo ""
            echo "packaged commit: \`$VERIFIED_SHA\`"
            echo ""
            echo "| stage | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in "prepare=$RESULT_PREPARE" "candidate=$RESULT_CANDIDATE" "manifests=$RESULT_MANIFESTS"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error title=release candidate gate::the release candidate entry requires every stage to succeed; skipped, cancelled, or failed stages are not a PASS"
            exit 1
          fi
